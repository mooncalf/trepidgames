<!DOCTYPE html>
<html>

<head lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width = device-width, user-scalable = yes">

  <title>Trepid Games Homepage</title>
  <meta name="description" content="Trepid Games Homepage">
  <link rel="icon" type="image/png" sizes="192x192" href="images/eyes-avatar-192x192.png">

  <style>
    a { color:#ffca37; }
    a:visited { color:#ffca37; }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000000;
    }

    .center {
      padding: 70px 0;
      text-align: center;
    }

    .matchlight {
      opacity: .85;
    }

    @media (prefers-reduced-motion: no-preference) {
      .matchlight {
        animation: matchlight-flicker 960ms step-end infinite,
                   matchlight-dip 5.3s step-end infinite;
      }
    }

    @keyframes matchlight-flicker {
      0%, 23%, 49%, 77%, 100% { fill-opacity: .82; }
      6%, 31%, 56%, 82% { fill-opacity: 1; }
      11%, 40%, 71%, 88% { fill-opacity: .48; }
      16%, 36%, 61%, 94% { fill-opacity: .91; }
      19%, 44%, 66%, 85% { fill-opacity: .64; }
      27%, 53%, 74%, 91% { fill-opacity: .36; }
    }

    @keyframes matchlight-dip {
      0%, 57%, 65%, 100% { opacity: .95; }
      58%, 63% { opacity: .65; }
      60% { opacity: .24; }
    }
  </style>

  <script src="../src/main/room/screen/FullScreenSetup.js"></script>

</head>

<body class="center">
<img width="382px" src="images/trepid_title.png">
<svg width="192" height="197" viewBox="0 0 40 41" xmlns="http://www.w3.org/2000/svg"
     shape-rendering="crispEdges" role="img" aria-label="Trepid Games pixel eyes in orange matchlight">
  <path class="matchlight" fill="#973e2f" transform="translate(-.5 .5)"
        d="M16 3H25v1h3v1h2v1h1v1h1v1h1v1h1v1h1v1h1v1h1v2h1v3h1
           v8h-1v3h-1v2h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-2v1h-3v1H16
           v-1h-3v-1h-2v-1h-1v-1h-1v-1h-1v-1h-1v-1h-1v-1h-1v-1h-1v-2h-1v-3h-1
           v-8h1v-3h1v-2h1v-1h1v-1h1v-1h1v-1h1v-1h1v-1h1v-1h2v-1h3z"/>
  <g fill="#faede6">
    <rect x="16" y="20" width="3" height="3"/>
    <rect x="21" y="20" width="3" height="3"/>
  </g>
  <g id="logo-pupils" fill="#000">
    <rect x="17" y="21" width="1" height="1"/>
    <rect x="22" y="21" width="1" height="1"/>
  </g>
</svg>
<!-- smegs <p style="font-size:22px;color:#fe933e">Meanwhile, find me on Canva at <a href="https://trepidgames.my.canva.site/">trepidgames.my.canva.site</a> ...</p>-->
<br>
<script>
  (() => {
    const pupils = document.getElementById("logo-pupils");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    // Both eyes use the same one-pixel offsets and glance patterns as the video.
    const poses = {
      center: { x: 0, y: 0, hold: [850, 2400], next: ["left"] },
      left: { x: -1, y: 0, hold: [350, 1350], next: ["center", "center", "upLeft", "downLeft"] },
      upLeft: { x: -1, y: -1, hold: [330, 750], next: ["left"] },
      downLeft: { x: -1, y: 1, hold: [400, 1400], next: ["left"] }
    };
    let gazeTimer;

    function look(pose) {
      const { x, y, hold: [min, max], next } = poses[pose];
      pupils.setAttribute("transform", `translate(${x} ${y})`);
      gazeTimer = window.setTimeout(() => {
        look(next[Math.floor(Math.random() * next.length)]);
      }, min + Math.random() * (max - min));
    }

    function syncMotion() {
      window.clearTimeout(gazeTimer);
      pupils.removeAttribute("transform");
      if (!reducedMotion.matches) look("center");
    }

    reducedMotion.addEventListener("change", syncMotion);
    syncMotion();
  })();
</script>
</body>
